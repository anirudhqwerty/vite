name: Verify outside-root inode reuse
on:
  push:
    branches: [verify/issue-23917]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      SIMPLE_GIT_HOOKS: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e
        with:
          runtime: node@24
          cache: true
          install: false
      - name: Record revision and tools
        run: |
          git rev-parse HEAD
          node --version
          pnpm --version
          df -Th . /tmp
      - name: Install focused dependencies
        run: pnpm install --no-frozen-lockfile --filter vite... --filter @vitejs/vite-monorepo
      - name: Format regression files
        run: pnpm exec oxfmt --write packages/vite/src/node/server/__tests__/watcher-inode.spec.ts packages/vite/src/node/server/__tests__/fixtures/watcher/inode-reuse.cjs
      - name: Verify final regression against unchanged upstream dependency patch
        run: |
          cp patches/chokidar@3.6.0.patch "$RUNNER_TEMP/fixed-chokidar.patch"
          git show cce559ab158cc6b177d0911a0bea73436b48faff:patches/chokidar@3.6.0.patch > patches/chokidar@3.6.0.patch
          pnpm install --no-frozen-lockfile --filter vite... --filter @vitejs/vite-monorepo
          set +e
          pnpm test-unit packages/vite/src/node/server/__tests__/watcher-inode.spec.ts > baseline-regression.log 2>&1
          result=$?
          set -e
          cat baseline-regression.log
          test "$result" -eq 1
          grep -F 'native watcher must stay attached after inode reuse' baseline-regression.log
          cp "$RUNNER_TEMP/fixed-chokidar.patch" patches/chokidar@3.6.0.patch
          pnpm install --no-frozen-lockfile --filter vite... --filter @vitejs/vite-monorepo
      - name: Build Vite JavaScript and declarations
        run: pnpm --filter vite build
      - name: Verify real regression and controls
        env:
          REPRO_TMPDIR: ${{ github.workspace }}
          MODE: fixed
        run: node investigation/verify.mjs 2>&1 | tee reproduction.log
      - name: Regression and relevant server tests
        run: pnpm test-unit packages/vite/src/node/server/__tests__ packages/vite/src/node/__tests__/utils.spec.ts 2>&1 | tee regression.log
      - name: Lint changed test
        run: pnpm exec oxlint packages/vite/src/node/server/__tests__/watcher-inode.spec.ts
      - name: Check formatting
        run: pnpm exec oxfmt --check packages/vite/src/node/server/__tests__/watcher-inode.spec.ts packages/vite/src/node/server/__tests__/fixtures/watcher/inode-reuse.cjs
      - name: Vite typecheck
        run: pnpm --filter vite typecheck
      - name: Record generated changes
        if: always()
        run: git diff --stat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inode-reuse-evidence
          path: |
            reproduction.log
            regression.log
            baseline-regression.log
            pnpm-lock.yaml
            packages/vite/src/node/server/__tests__/watcher-inode.spec.ts
            packages/vite/src/node/server/__tests__/fixtures/watcher/inode-reuse.cjs
